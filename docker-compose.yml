version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: db-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 5s
    networks:
      - app-network

  # OPCIÓN 1: Backend con Rust + Actix Web (ACTIVO)
  backend-rust:
    build:
      context: ./rust-actix
      dockerfile: Dockerfile
    container_name: backend-rust
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      RUST_LOG: info
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # OPCIÓN 2: Backend con Node.js + Express (DESACTIVADO - descomentar para comparación)
  # backend-node:
  #   build:
  #     context: ./nodejs-express
  #     dockerfile: Dockerfile
  #   container_name: backend-node
  #   environment:
  #     APP_HOST: 0.0.0.0
  #     APP_PORT: 8081
  #     DB_HOST: mysql
  #     DB_PORT: 3306
  #     DB_USER: ${DB_USER}
  #     DB_PASSWORD: ${DB_PASSWORD}
  #     DB_NAME: ${DB_NAME}
  #   ports:
  #     - "8081:8080"
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #   networks:
  #     - app-network
  #   restart: unless-stopped

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
