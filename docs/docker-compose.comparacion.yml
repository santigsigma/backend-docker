# docker-compose-comparacion.yml
# Ejecutar ambos backends simultáneamente para comparación

version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: db-mysql
    environment:
      MYSQL_ROOT_PASSWORD: mysecurepassword
      MYSQL_DATABASE: dbapp
      MYSQL_USER: root
      MYSQL_PASSWORD: mysecurepassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - app-network

  # Backend Rust + Actix Web
  backend-rust:
    build:
      context: ./rust-actix
      dockerfile: Dockerfile
    container_name: backend-rust
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: mysecurepassword
      DB_NAME: dbapp
      RUST_LOG: info
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  # Backend Node.js + Express
  backend-node:
    build:
      context: ./nodejs-express
      dockerfile: Dockerfile
    container_name: backend-node
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: mysecurepassword
      DB_NAME: dbapp
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
